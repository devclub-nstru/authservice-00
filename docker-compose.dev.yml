version: "3.8"

services:
  db:
    image: postgres:16
    container_name: kael-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kael
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kael-redis

  migrate:
    build: .
    container_name: kael-migrate
    command: /app/migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/kael?sslmode=disable
    depends_on:
      - db

  server:
    build: .
    container_name: kael-server
    command: /app/server
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/kael?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8080"
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: kael-worker
    command: /app/worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/kael?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

volumes:
  db_data:
